name: CI/CD - Ergo Site

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
    types: [opened, synchronize, ready_for_review]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ergo-site
  NAMESPACE: ergo
  DEPLOYMENT_NAME: ergo-site

jobs:
  # Job 1: Tests et validation
  validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      
      - name: Validate Kubernetes manifests
        uses: instrumenta/kubeval-action@main
        with:
          files: k8s/
      
      - name: Run security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload security results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 2: Build et push
  build:
    runs-on: ubuntu-latest
    needs: validate
    if: success() && (github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft))
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  # Job 3: Déploiement (environnement staging)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && success()
    environment:
      name: staging
      url: https://staging.ergo.tdksoft.com
    concurrency:
      group: staging-deployment
      cancel-in-progress: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_BASE64_STAGING }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      
      - name: Update image tag in manifests
        run: |
          # Extraire le SHA du dernier commit
          SHA_SHORT=$(git rev-parse --short=7 HEAD)
          sed -i "s|image:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop-${SHA_SHORT}|g" k8s/deployment.yaml
      
      - name: Deploy to staging
        run: |
          kubectl apply -f k8s/ -n staging
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n staging --timeout=5m
          kubectl rollout restart deployment/${{ env.DEPLOYMENT_NAME }} -n staging
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n staging --timeout=3m
      
      - name: Verify deployment
        run: |
          kubectl get pods -n staging
          kubectl get svc -n staging

  # Job 4: Déploiement (environnement production)
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && success()
    environment:
      name: production
      url: https://ergo.tdksoft.com
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_BASE64_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      
      - name: Verify image exists
        run: |
          # Vérifier que l'image existe avant déploiement
          docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      
      - name: Deploy to production
        run: |
          # Appliquer les manifests
          kubectl apply -f k8s/ -n ${{ env.NAMESPACE }}
          
          # Attendre que le déploiement soit prêt
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --timeout=5m
          
          # Redémarrer avec rollout progressif
          kubectl rollout restart deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --timeout=3m
      
      - name: Post-deployment validation
        run: |
          # Vérifier les endpoints
          kubectl get endpoints -n ${{ env.NAMESPACE }}
          kubectl get ingress -n ${{ env.NAMESPACE }}
          
          # Vérifier la santé des pods
          PODS=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.DEPLOYMENT_NAME }} -o jsonpath='{.items[*].status.phase}')
          if [[ "$PODS" != *"Running"* ]]; then
            echo "❌ Les pods ne sont pas en état Running"
            exit 1
          fi
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "🚨 Déploiement échoué pour ${{ env.DEPLOYMENT_NAME }}"
          # Ajouter ici notification Slack/Teams/Email

  # Job 5: Cleanup (optionnel)
  cleanup:
    runs-on: ubuntu-latest
    needs: deploy-production
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Clean old images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: container
          min-versions-to-keep: 10