name: Ergo Site Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  # ---------------------------------------------------------
  # JOB 1: CI - Build the optimized image
  # ---------------------------------------------------------
  ci-build:
    name: "Build & Push Image"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }} # On exporte la version pour le job CD
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Build and Push (Multi-stage)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---------------------------------------------------------
  # JOB 2: CD - Deploy to VPS (Directed Link)
  # ---------------------------------------------------------
  cd-deploy:
    name: "Deploy to Production"
    needs: ci-build # <--- LE GRAPHE SE CRÉE ICI
    if: startsWith(github.ref, 'refs/tags/v') # Ne déploie QUE si c'est un tag v*
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Render Manifest
        run: |
          cd k8s/overlays/production
          # On utilise l'output du job précédent pour garantir la même version
          kustomize edit set image ghcr.io/tdk-soft/ergo-maffo-cloud-native/ergo-site=ghcr.io/${{ github.repository }}:${{ needs.ci-build.outputs.version }}
          kustomize build . > rendered-manifest.yaml

      - name: Setup Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Deploy to Cluster
        uses: azure/k8s-deploy@v5
        with:
          action: deploy
          strategy: basic
          manifests: k8s/overlays/production/rendered-manifest.yaml
          namespace: ergo-prod
          imagepullsecrets: |
            prod-ghcr-login