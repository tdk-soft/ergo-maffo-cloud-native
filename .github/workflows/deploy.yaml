name: Deploy Ergo Site

on:
  push:
      - main
    tags:
      - 'v*' # Triggers on v1.0.0, v1.0.1, v1.0.2, etc.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update and Build Kustomize Manifest
        run: |
          # 1. Extract tag name from ref (e.g., v1.0.2)
          TAG_NAME=${GITHUB_REF#refs/tags/}
          cd k8s/overlays/production
          
          # 2. Update the image tag in the production overlay
          kustomize edit set image ghcr.io/tdk-soft/ergo-maffo-cloud-native/ergo-site=ghcr.io/${{ github.repository }}:$TAG_NAME
          
          # 3. Render the full multi-resource manifest into a single file
          kustomize build . > rendered-manifest.yaml

      - name: Deploy to VPS Cluster
        run: |
          # 1. Security check for the secret
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "ERROR: Secret KUBE_CONFIG is empty or not found!"
            exit 1
          fi

          # 2. Setup directory and injection
          mkdir -p $HOME/.kube
          # Use printf to avoid character escaping issues
          printf "%s" "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          
          # 3. Test connection before applying
          echo "Testing connection to cluster..."
          kubectl cluster-info
          
          # 4. Apply the manifest
          kubectl apply -f k8s/overlays/production/rendered-manifest.yaml --namespace ergo-prod
          
          # 5. Verify the deployment
          kubectl rollout status deployment prod-ergo-site -n ergo-prod --timeout=120s