# GitHub Actions workflow for building and deploying Ergo Site to VPS cluster
name: Deploy Ergo Site

#on:
  #push:
    #branches:
      #- main
    #tags:
      #- 'v*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Checkout the source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      # Step 4: Extract Metadata for tagging
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      # Step 5: Build and Push image
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Step 6: Set up Kustomize CLI (Required for the deploy action's kustomize mode)
      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      # Step 7: Update the Kustomize image tag locally
      # We still do this step to ensure the local kustomization.yaml is updated
      - name: Update Kustomize Image
        run: |
          cd k8s/overlays/production
          kustomize edit set image ghcr.io/tdk-soft/ergo-maffo-cloud-native/ergo-site=ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

      # Step 8: Set Kubernetes Context using the KUBE_CONFIG secret
      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_BASE64 }} # Assuming Base64; use KUBE_CONFIG if raw text

      # Step 9: Deploy using the Kustomization path
      - name: Deploy to VPS Cluster
        uses: azure/k8s-deploy@v5
        with:
          action: deploy
          strategy: basic
          # Point directly to the kustomization directory
          kustomizationPath: ./k8s/overlays/production
          namespace: ergo-prod