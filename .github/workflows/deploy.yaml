name: Deploy Ergo Site

on:
  push:
    tags:
      - 'v*' # Triggers on v1.0.0, v1.0.1, etc.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Kustomize Image Tag
        run: |
          # Get the tag name (e.g., v1.0.0)
          TAG_NAME=${GITHUB_REF#refs/tags/}
          cd k8s/overlays/production
          kustomize edit set image ghcr.io/tdk-soft/ergo-maffo-cloud-native/ergo-site=ghcr.io/${{ github.repository }}:$TAG_NAME

      - name: Deploy to Kubernetes
        uses: azure/k8s-deploy@v4
        with:
          action: deploy
          strategy: basic
          manifests: |
            # We generate the manifest on the fly using kustomize build
          namespace: ergo-prod
          kustomizationPath: ./k8s/overlays/production
          kubeconfig: ${{ secrets.KUBE_CONFIG }}