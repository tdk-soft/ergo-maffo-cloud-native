name: CI/CD - Ergo Site

on:
  push:
    branches:
      - main
      - develop

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/ergo-site

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login GHCR
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 3. Build image
      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:latest .

      # 4. Push image
      - name: Push image
        run: docker push $IMAGE_NAME:latest

      # 5. Setup kubectl
      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_BASE64 }}" | base64 -d > ~/.kube/config

      # 6. Deploy to Kubernetes
      - name: Deploy
        run: |
          kubectl apply -f k8s/
          kubectl rollout restart deployment ergo-site