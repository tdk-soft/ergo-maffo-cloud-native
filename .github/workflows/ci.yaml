name: CI - Build & Test

on:
  push:
    branches: [ main ]
    paths-ignore:      # Don't build if we only change documentation
      - '**.md'
      - 'k8s/**'

jobs:
  build-and-push-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and Push Dev Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest-dev # Development tag