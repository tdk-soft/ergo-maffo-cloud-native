name: CD - Deploy to Staging

on:
  workflow_run:
    workflows: ["CI - Continuous Integration"]
    branches: ["develop"]
    types:
      - completed
  workflow_dispatch:  # Déploiement manuel

env:
  ENVIRONMENT: staging
  NAMESPACE: ergo-staging
  DOMAIN: staging.ergo.tdksoft.com
  KUSTOMIZE_PATH: k8s/overlays/staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: staging
      url: https://staging.ergo.tdksoft.com
    concurrency:
      group: staging-deployment
      cancel-in-progress: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup kubectl
        uses: ./.github/actions/setup-kubectl
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_BASE64_STAGING }}
      
      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
      
      - name: Validate manifests
        run: |
          kustomize build ${{ env.KUSTOMIZE_PATH }} | kubeval --strict
      
      - name: Deploy with kustomize
        uses: ./.github/actions/deploy-kustomize
        with:
          path: ${{ env.KUSTOMIZE_PATH }}
          namespace: ${{ env.NAMESPACE }}
          wait-timeout: 5m
      
      - name: Run smoke tests
        run: |
          ./.github/scripts/health-check.sh ${{ env.DOMAIN }}
      
      - name: Notify Slack
        uses: ./.github/actions/notify-slack
        if: always()
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_STAGING }}
          status: ${{ job.status }}
          environment: staging