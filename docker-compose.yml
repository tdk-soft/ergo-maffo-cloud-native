services:
  # The name of your service
  ergo-site:
    # Build configuration
    build:
      context: .
      dockerfile: Dockerfile
    # Image name for the local registry
    image: ergo-site:latest
    # Container name for easier identification
    container_name: ergo-site-app
    # Restart policy
    restart: always
    # Port mapping: [Host Port]:[Container Port]
    ports:
      - "3000:3000"
    # Environment variables
    environment:
      - NODE_ENV=production
      - PORT=3000
    # Healthcheck to ensure the app is responding
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3