apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ergo

bases:
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml
  - ingress-patch.yaml

configMapGenerator:
  - name: ergo-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=warn
      - CORS_ENABLED=false
      - CACHE_TTL=3600

secretGenerator:
  - name: ergo-secrets
    behavior: replace
    envs:
      - secrets.env  # À ajouter dans .gitignore

replicas:
  - name: ergo-site
    count: 3

images:
  - name: ghcr.io/tdk-soft/ergo-maffo-cloud-native/ergo-site
    newTag: latest

commonAnnotations:
  environment: production
  sla-tier: gold

patches:
  - target:
      kind: Deployment
      name: ergo-site
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m