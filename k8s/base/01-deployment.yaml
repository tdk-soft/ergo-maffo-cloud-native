apiVersion: apps/v1
kind: Deployment
metadata:
  name: ergo-site
  namespace: ergo
  labels:
    app: ergo-site
    app.kubernetes.io/name: ergo-site
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: ergo-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1  # Surchargé par overlay
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ergo-site
  template:
    metadata:
      labels:
        app: ergo-site
        app.kubernetes.io/name: ergo-site
        app.kubernetes.io/version: latest
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
        checksum/config: ${CONFIGMAP_HASH}
    spec:
      containers:
        - name: ergo-site
          image: ghcr.io/tdk-soft/ergo-maffo-cloud-native/ergo-site:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: ergo-config
                  key: NODE_ENV
            - name: PORT
              value: "3000"
          envFrom:
            - configMapRef:
                name: ergo-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
      terminationGracePeriodSeconds: 30