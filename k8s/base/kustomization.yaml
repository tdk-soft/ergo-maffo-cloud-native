apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ergo

resources:
  - 00-namespace.yaml
  - 01-deployment.yaml
  - 02-service.yaml
  - 03-ingress.yaml
  - 04-configmap.yaml
  - 05-secret.yaml
  - 06-hpa.yaml
  - 07-pdb.yaml
  - 08-networkpolicy.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: ergo-platform

commonAnnotations:
  deployed-by: kustomize
  environment: base

images:
  - name: ghcr.io/tdk-soft/ergo-maffo-cloud-native/ergo-site
    newName: ghcr.io/tdk-soft/ergo-maffo-cloud-native/ergo-site
    newTag: latest

configMapGenerator:
  - name: ergo-config
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - CORS_ENABLED=true
    behavior: merge

secretGenerator:
  - name: ergo-secrets
    literals:
      - API_KEY=placeholder  # À surcharger en production
    behavior: replace
    type: Opaque

patchesStrategicMerge:
  - patches/resources.yaml
  - patches/security.yaml

patchesJson6902:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ergo-site
    path: patches/monitoring.yaml