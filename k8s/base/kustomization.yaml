apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

commonAnnotations:
  deployed-by: kustomize
  environment: production

images:
  - name: ghcr.io/tdk-soft/ergo-maffo-cloud-native/ergo-site
    newTag: latest

configMapGenerator:
  - name: ergo-config
    envs:
      - configs/base-config.env

secretGenerator:
  - name: ergo-secrets
    envs:
      - configs/base-secret.env
    options:
      disableNameSuffixHash: false 

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: ergo-platform

patches:
  - path: patches/monitoring.yaml
  - path: patches/resources.yaml
  - path: patches/security.yaml